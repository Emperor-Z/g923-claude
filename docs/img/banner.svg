<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <radialGradient id="glow" cx="28%" cy="45%" r="60%">
      <stop offset="0" stop-color="#ff5a36" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff5a36" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f47"/>
      <stop offset="1" stop-color="#16191e"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3038"/>
      <stop offset="1" stop-color="#121418"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="#0b0e13"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- speed lines -->
  <g stroke="#ff5a36" stroke-linecap="round" opacity="0.55">
    <line x1="40" y1="150" x2="120" y2="150" stroke-width="3"/>
    <line x1="20" y1="185" x2="90" y2="185" stroke-width="2" opacity="0.6"/>
    <line x1="55" y1="470" x2="125" y2="470" stroke-width="3"/>
    <line x1="30" y1="505" x2="80" y2="505" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- wheel -->
  <g transform="translate(340 300)">
    <circle r="200" fill="none" stroke="url(#rim)" stroke-width="44"/>
    <circle r="200" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="2"/>
    <rect x="-7" y="-224" width="14" height="44" rx="4" fill="#ff5a36"/>
    <!-- spokes -->
    <path d="M-178 -10 L-70 -40 L-70 40 L-178 30 Z" fill="url(#hub)"/>
    <path d="M178 -10 L70 -40 L70 40 L178 30 Z" fill="url(#hub)"/>
    <path d="M-40 60 L40 60 L28 178 L-28 178 Z" fill="url(#hub)"/>
    <circle r="86" fill="url(#hub)" stroke="#2e333b" stroke-width="2"/>
    <!-- d-pad -->
    <g transform="translate(-125 0)" fill="#59606b">
      <rect x="-8" y="-26" width="16" height="52" rx="3"/>
      <rect x="-26" y="-8" width="52" height="16" rx="3"/>
    </g>
    <!-- face buttons -->
    <g transform="translate(125 0)" font-family="ui-sans-serif, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
      <circle cx="0" cy="-22" r="11" fill="#2a2f37" stroke="#4fd1c5" stroke-width="2"/>
      <circle cx="22" cy="0" r="11" fill="#2a2f37" stroke="#ff6b81" stroke-width="2"/>
      <circle cx="-22" cy="0" r="11" fill="#2a2f37" stroke="#d6a2e8" stroke-width="2"/>
      <circle cx="0" cy="22" r="11" fill="#2a2f37" stroke="#7aa7ff" stroke-width="2"/>
    </g>
    <!-- red dial -->
    <circle cx="70" cy="120" r="17" fill="#c0392b" stroke="#ff7a5c" stroke-width="2"/>
    <circle cx="70" cy="120" r="6" fill="#7d2016"/>
    <!-- hub badge -->
    <text y="10" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="#ff5a36">&gt;_</text>
  </g>

  <!-- pedals -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1">
    <g transform="translate(200 560)">
      <rect x="-48" y="-30" width="96" height="60" rx="10" fill="#1b1f26" stroke="#3a3f47" stroke-width="2"/>
      <text y="6" fill="#8b949e">CLUTCH</text>
    </g>
    <g transform="translate(340 560)">
      <rect x="-48" y="-30" width="96" height="60" rx="10" fill="#1b1f26" stroke="#ff6b81" stroke-width="2"/>
      <text y="6" fill="#ff6b81">ESC</text>
    </g>
    <g transform="translate(480 560)">
      <rect x="-48" y="-30" width="96" height="60" rx="10" fill="#1b1f26" stroke="#4fd1c5" stroke-width="2"/>
      <text y="6" fill="#4fd1c5">ENTER</text>
    </g>
  </g>

  <!-- title -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="640" y="170" font-size="76" font-weight="800" fill="#f0f3f6" letter-spacing="-2">g923-claude</text>
    <text x="644" y="222" font-size="30" font-weight="500" fill="#9aa4b2">Drive Claude Code with a racing wheel.</text>
  </g>

  <!-- terminal -->
  <g transform="translate(640 262)">
    <rect width="580" height="300" rx="14" fill="#11151b" stroke="#2a2f37" stroke-width="2"/>
    <circle cx="26" cy="24" r="7" fill="#ff5f57"/>
    <circle cx="50" cy="24" r="7" fill="#febc2e"/>
    <circle cx="74" cy="24" r="7" fill="#28c840"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21">
      <text x="28" y="88" fill="#ff6b81">brake</text><text x="150" y="88" fill="#59606b">──▶</text><text x="212" y="88" fill="#e6edf3">interrupt Claude</text>
      <text x="28" y="130" fill="#4fd1c5">gas</text><text x="150" y="130" fill="#59606b">──▶</text><text x="212" y="130" fill="#e6edf3">send / accept</text>
      <text x="28" y="172" fill="#ffb86b">gear 3</text><text x="150" y="172" fill="#59606b">──▶</text><text x="212" y="172" fill="#e6edf3">/model opus</text>
      <text x="28" y="214" fill="#7aa7ff">steer</text><text x="150" y="214" fill="#59606b">──▶</text><text x="212" y="214" fill="#e6edf3">scroll output</text>
      <text x="28" y="256" fill="#d6a2e8">✕ ○ □</text><text x="150" y="256" fill="#59606b">──▶</text><text x="212" y="256" fill="#e6edf3">yes · no · always</text>
    </g>
  </g>
</svg>
